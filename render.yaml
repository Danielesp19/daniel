# ── Blueprint de Render ─────────────────────────────────────────────
# En Render: New → Blueprint → conecta este repo. Render lee este archivo y
# crea la API, el worker de la cola y una base Postgres, inyectando las
# credenciales de la base automáticamente (fromDatabase).
#
# Las variables marcadas con `sync: false` se rellenan a mano en el dashboard:
# son secretas o dependen de la URL final del servicio.
#
# El sitio (web/) NO va aquí: se despliega en Vercel. Ver DESPLIEGUE.md.

databases:
  - name: barista-db
    plan: free            # gratis ~90 días; suficiente para una demo
    databaseName: barista
    user: barista

services:
  # ── API ───────────────────────────────────────────────────────────────────
  - type: web
    name: barista-api
    runtime: docker
    plan: free            # se duerme tras ~15 min sin tráfico (la 1ª petición tarda ~40 s)
    region: oregon
    dockerfilePath: api/Dockerfile
    dockerContext: api
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Daniel Buitrón · Barista"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false        # php artisan key:generate --show  (formato base64:...)
      - key: APP_URL
        sync: false        # la URL del propio servicio, p.ej. https://barista-api.onrender.com
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr      # Render captura stdout/stderr en sus logs
      - key: LOG_LEVEL
        value: warning

      # ── Base de datos ──────────────────────────────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: barista-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: barista-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: barista-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: barista-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: barista-db, property: password }

      # La cola no es opcional: el chatbot despacha su trabajo ahí.
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database

      # ── Tienda ─────────────────────────────────────────────────────────────
      - key: ADMIN_TOKEN
        generateValue: true   # Render genera uno aleatorio y lo comparte con el worker
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # el dominio del sitio en Vercel, sin barra final
      - key: SITIO_URL
        sync: false           # el mismo dominio: se usa para revalidar y para dar el enlace
      - key: REVALIDAR_SECRETO
        sync: false           # EXACTAMENTE el mismo valor que en Vercel

      # ── Chatbot ────────────────────────────────────────────────────────────
      # Sin CHATBOT_ADMINS el bot ignora todos los mensajes; sin
      # CHATBOT_APP_SECRET rechaza todos los webhooks. Es a propósito.
      - key: CHATBOT_ADMINS
        sync: false
      - key: CHATBOT_VERIFY_TOKEN
        sync: false
      - key: CHATBOT_APP_SECRET
        sync: false
      - key: CHATBOT_PHONE_ID
        sync: false
      - key: CHATBOT_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Worker de la cola ─────────────────────────────────────────────────────
  # Separado de la API a propósito: el webhook tiene que responderle a Meta en
  # segundos, y una vuelta del modelo con herramientas tarda bastante más.
  # Comparte entorno con la API vía envVarGroup no; aquí se repiten las claves
  # que necesita para conectarse a la misma base y a la misma API de Claude.
  - type: worker
    name: barista-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: api/Dockerfile
    dockerContext: api
    dockerCommand: php artisan queue:work --tries=2 --timeout=200 --sleep=3
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false        # el MISMO valor que la API, o no podrá leer nada cifrado
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: barista-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: barista-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: barista-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: barista-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: barista-db, property: password }

      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

      - key: CHATBOT_PHONE_ID
        sync: false
      - key: CHATBOT_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHATBOT_MODELO
        value: claude-opus-5

      # El worker es quien de verdad ejecuta los cambios del chat, así que es
      # el que tiene que poder avisarle al sitio que se regenere.
      - key: SITIO_URL
        sync: false
      - key: REVALIDAR_SECRETO
        sync: false
